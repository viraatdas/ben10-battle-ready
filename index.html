<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben 10: Battle Ready</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='31' fill='%23000'/><circle cx='32' cy='32' r='27' fill='%23e6e6e6'/><circle cx='32' cy='32' r='23' fill='%23000'/><circle cx='32' cy='32' r='20' fill='%2317c217'/><path d='M16 12 L48 12 L32 32 L48 52 L16 52 L32 32 Z' fill='%23000'/></svg>">
    <!-- Preload the polyfill and the largest cast file so the browser
         starts downloading them in parallel with the HTML parse instead
         of waiting until the <script> tag is hit. ~12MB polyfill =
         biggest item on the critical path. -->
    <link rel="preload" as="script" href="dirplayer-polyfill.js">
    <link rel="preload" as="fetch" href="game/game.dcr" crossorigin>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <noscript>
            <embed
                id="game"
                src="game/game.dcr"
                type="application/x-director"
                width="780"
                height="480"
                bgcolor="#000000"
                swStretchStyle="none"
                data-sw-_runMode="Plugin"
                data-sw-_moviePath="game/"
            >
        </noscript>
    </div>

    <script src="dirplayer-polyfill.js"></script>
    <script>
        // Window-level ESC fallback: the polyfill's React onKeyDown only fires
        // when the game container has focus, which is easy to lose (clicking
        // outside the canvas, opening DevTools, etc).
        window.addEventListener("keydown", function (e) {
            if (e.key !== "Escape" && e.keyCode !== 27) return;
            var fn = window.force_exit_mission;
            if (typeof fn !== "function") return;
            e.preventDefault();
            try { fn(); } catch (_) {}
        }, true);

        // Strip the soft circular "spotlight" sprites that the original game
        // draws around Ben and around the green XP orbs. Implemented as a
        // periodic Lingo eval through the polyfill's WASM bindings since the
        // sprite is rendered by the in-game scene, not by anything in JS.
        (function () {
            var KEYWORDS = ["light", "spot", "halo", "shadow", "vignette",
                            "glow", "fog", "dark", "mask", "circle", "lite",
                            "lamp", "torch", "lume", "ambient", "lit"];
            var MAX_CHANNEL = 240;
            var lastBlock = null;

            function evalLingo(code) {
                var vm = window.__vm;
                if (!vm || !vm.eval_command || !vm.__wbindgen_malloc ||
                    !vm.memory) return false;
                try {
                    var enc = new TextEncoder().encode(code);
                    var ptr = vm.__wbindgen_malloc(enc.length, 1);
                    new Uint8Array(vm.memory.buffer, ptr, enc.length).set(enc);
                    vm.eval_command(ptr, enc.length);
                    return true;
                } catch (_) { return false; }
            }

            function spriteCheck(i) {
                if (lastBlock === null) {
                    var parts = [];
                    for (var k = 0; k < KEYWORDS.length; k++) {
                        parts.push('NM contains "' + KEYWORDS[k] + '"');
                    }
                    lastBlock = parts.join(" or ");
                }
                return (
                    "if voidP(sprite(" + i + ").member) = 0 then " +
                    "if voidP(sprite(" + i + ").member.name) = 0 then " +
                    "if (" + lastBlock.replace(/NM/g,
                        "sprite(" + i + ").member.name") + ") then " +
                    "sprite(" + i + ").visible = 0"
                );
            }

            function strip() {
                if (!window.__vm || !window.__vm.eval_command) return;
                for (var i = 1; i <= MAX_CHANNEL; i++) evalLingo(spriteCheck(i));
            }

            // Expose for debugging: window.__strip_spotlight() in DevTools.
            window.__strip_spotlight = strip;

            function start() {
                if (!window.__vm || !window.__vm.eval_command) {
                    setTimeout(start, 200);
                    return;
                }
                strip();
                setInterval(strip, 500);
            }
            start();
        })();
    </script>
</body>
</html>
