<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben 10: Battle Ready</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='31' fill='%23000'/><circle cx='32' cy='32' r='27' fill='%23e6e6e6'/><circle cx='32' cy='32' r='23' fill='%23000'/><circle cx='32' cy='32' r='20' fill='%2317c217'/><path d='M16 12 L48 12 L32 32 L48 52 L16 52 L32 32 Z' fill='%23000'/></svg>">
    <!-- Start the emulator and patched Director casts during HTML parse so
         DirPlayer can reuse the fetch cache instead of discovering the
         external libraries serially during boot. -->
    <link rel="preload" as="script" href="dirplayer-polyfill.js">
    <link rel="preload" as="fetch" href="game/game.dcr" crossorigin>
    <link rel="preload" as="fetch" href="game/emp01.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp02.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp03.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp04.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp05.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp06.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp07.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp08.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp09.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp10.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp11.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp12.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp13.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp14.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp15.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp16.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp17.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp18.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp19.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp20.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp21.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp22.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp23.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp24.cct" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/alien-force.css">
</head>
<body>
    <div id="game-container">
        <!-- data-src keeps the browser from invoking its removed native
             plug-in path; DirPlayer recognizes the MIME type and consumes
             data-src when it replaces this element at DOMContentLoaded. -->
        <embed
            id="game"
            data-src="game/game.dcr"
            type="application/x-director"
            bgcolor="#000000"
            swStretchStyle="none"
            data-sw-_runMode="Plugin"
            data-sw-_moviePath="game/"
        >
    </div>

    <!-- The standalone SWF is a legacy tracker. The embedded mission Flash
         member is replaced with a native bitmap below, so Ruffle is not
         needed during boot. -->
    <script src="dirplayer-polyfill.js" data-disable-flash></script>
    <script src="js/alien-force-renderer.js"></script>
    <script src="js/alien-force-extension.js"></script>
    <script>
        // Window-level ESC fallback: the polyfill's React onKeyDown only fires
        // when the game container has focus, which is easy to lose (clicking
        // outside the canvas, opening DevTools, etc).
        window.addEventListener("keydown", function (e) {
            if (e.key !== "Escape" && e.keyCode !== 27) return;
            if (window.Ben10AlienForce &&
                    window.Ben10AlienForce.getState().selectorOpen) return;
            var fn = window.__vm && window.__vm.force_exit_mission;
            if (typeof fn !== "function") return;
            e.preventDefault();
            try { fn(); } catch (_) {}
        }, true);

        // The mission preview is an embedded Flash member that DirPlayer
        // currently paints as an opaque white rectangle. Repair the popup
        // through the safe MCP expression bridge: hide the broken intro
        // filmloop, keep the native controls visible, and use each alien's
        // original ready bitmap as the preview.
        (function () {
            var PREVIEW_MEMBERS = [
                null,
                "wildmutt_R_ready",
                "fourarms_R_ready",
                "heatblast_ready",
                "xlr8_ready",
                "ghostfreak_R_ready_1",
                "ripjaw_R_ready",
                "stinkfly_ready_1",
                "graymatter_ready",
                "diamondhead_R_ready",
                "upgrade_ready"
            ];
            var activePopupID = 0;
            var repairGeneration = 0;

            async function evalLingo(expression) {
                if (typeof window.__ben10EvalLingo === "function") {
                    return window.__ben10EvalLingo(expression);
                }
                var vm = window.__vm;
                if (!vm || typeof vm.mcp_eval_lingo !== "function") return;
                try { await vm.mcp_eval_lingo(expression); } catch (_) {}
            }

            async function repairPopup(id, generation) {
                var preview = PREVIEW_MEMBERS[id];
                if (!preview || generation !== repairGeneration) return;

                await evalLingo("game.popup.screenOverlay.visSprite.visible = 0");
                if (generation !== repairGeneration) return;
                await evalLingo("game.popup.bgOverlay.visSprite.visible = 1");
                await evalLingo("game.popup.animOverlay.visSprite.visible = 1");
                await evalLingo("game.popup.startButton.visSprite.visible = 1");
                await evalLingo("game.popup.cancelButton.visSprite.visible = 1");
                await evalLingo("game.popup.buttonBracket.visSprite.visible = 1");
                await evalLingo(
                    'game.popup.animOverlay.visSprite.member = member("' +
                    preview + '")'
                );
            }

            function scheduleRepair(id) {
                var generation = ++repairGeneration;
                repairPopup(id, generation);
                setTimeout(function () { repairPopup(id, generation); }, 200);
                setTimeout(function () { repairPopup(id, generation); }, 600);
            }

            function pollPopup() {
                var vm = window.__vm;
                if (!vm || typeof vm.get_popup_char_id !== "function") return;

                var id = 0;
                try { id = vm.get_popup_char_id(); } catch (_) {}
                if (id > 0 && id < PREVIEW_MEMBERS.length) {
                    if (id !== activePopupID) {
                        activePopupID = id;
                        scheduleRepair(id);
                    }
                } else if (activePopupID !== 0) {
                    activePopupID = 0;
                    repairGeneration++;
                }
            }

            window.__repair_mission_popup = function () {
                if (activePopupID > 0) scheduleRepair(activePopupID);
            };
            setInterval(pollPopup, 120);
        })();
    </script>
</body>
</html>
