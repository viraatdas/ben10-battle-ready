<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben 10: Battle Ready</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='31' fill='%23000'/><circle cx='32' cy='32' r='27' fill='%23e6e6e6'/><circle cx='32' cy='32' r='23' fill='%23000'/><circle cx='32' cy='32' r='20' fill='%2317c217'/><path d='M16 12 L48 12 L32 32 L48 52 L16 52 L32 32 Z' fill='%23000'/></svg>">
    <!-- Start the emulator and patched Director casts during HTML parse so
         DirPlayer can reuse the fetch cache instead of discovering the
         external libraries serially during boot. -->
    <link rel="preload" as="script" href="dirplayer-polyfill.js">
    <link rel="preload" as="fetch" href="game/game.dcr" crossorigin>
    <link rel="preload" as="fetch" href="game/emp01.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp02.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp03.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp04.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp05.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp06.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp07.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp08.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp09.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp10.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp11.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp12.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp13.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp14.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp15.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp16.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp17.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp18.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp19.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp20.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp21.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp22.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp23.cct" crossorigin>
    <link rel="preload" as="fetch" href="game/emp24.cct" crossorigin>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <noscript>
            <embed
                id="game"
                src="game/game.dcr"
                type="application/x-director"
                width="780"
                height="480"
                bgcolor="#000000"
                swStretchStyle="none"
                data-sw-_runMode="Plugin"
                data-sw-_moviePath="game/"
            >
        </noscript>
    </div>

    <!-- The only shipped SWF is a legacy tracker, so skip Ruffle during boot. -->
    <script src="dirplayer-polyfill.js" data-disable-flash></script>
    <script>
        // Window-level ESC fallback: the polyfill's React onKeyDown only fires
        // when the game container has focus, which is easy to lose (clicking
        // outside the canvas, opening DevTools, etc).
        window.addEventListener("keydown", function (e) {
            if (e.key !== "Escape" && e.keyCode !== 27) return;
            var fn = window.force_exit_mission;
            if (typeof fn !== "function") return;
            e.preventDefault();
            try { fn(); } catch (_) {}
        }, true);

        // Strip the soft circular character shadow. It is rendered by the
        // original Director scene, so the page has to hide the runtime sprite
        // through Lingo rather than CSS.
        (function () {
            // Ben is channel 350 on the hub; his circular shadow is 351.
            var SHADOW_CHANNEL = 351;
            var stripStarted = false;

            function evalLingo(code) {
                var vm = window.__vm;
                if (!vm || !vm.eval_command) return false;
                try {
                    if (vm.__wbindgen_malloc && vm.memory) {
                        var enc = new TextEncoder().encode(code);
                        var ptr = vm.__wbindgen_malloc(enc.length, 1);
                        new Uint8Array(vm.memory.buffer, ptr, enc.length).set(enc);
                        vm.eval_command(ptr, enc.length);
                    } else {
                        vm.eval_command(code);
                    }
                    return true;
                } catch (_) { return false; }
            }

            function strip() {
                if (!window.__vm || !window.__vm.eval_command) return;
                evalLingo(
                    'if sprite(' + SHADOW_CHANNEL + ').width > 0 then ' +
                    'if sprite(' + SHADOW_CHANNEL + ').height > 0 then ' +
                    'if sprite(' + SHADOW_CHANNEL + ').member.name = "shadow_round" then ' +
                    'sprite(' + SHADOW_CHANNEL + ').visible = 0'
                );
            }

            // Expose for debugging: window.__strip_spotlight() in DevTools.
            window.__strip_spotlight = strip;

            function start() {
                if (stripStarted) return;
                if (!window.__vm || !window.__vm.eval_command) {
                    setTimeout(start, 200);
                    return;
                }
                stripStarted = true;
                strip();
                setInterval(strip, 500);
            }

            function scheduleStart() {
                window.removeEventListener("pointerdown", scheduleStart, true);
                window.removeEventListener("keydown", scheduleStart, true);
                setTimeout(start, 10000);
            }

            window.addEventListener("pointerdown", scheduleStart, true);
            window.addEventListener("keydown", scheduleStart, true);
        })();
    </script>
</body>
</html>
